version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    ignore:
      # The repo imports github.com/twilio/twilio-go/rest/assistants/v1, which exists
      # only in v1.30.x; newer twilio-go releases drop that namespace, so Dependabot
      # cannot resolve an update without breaking the build. Keep the pinned v1.30.9.
      github.com/twilio/twilio-go:
        - "*"

    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
